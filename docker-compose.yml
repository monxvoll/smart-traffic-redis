services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  publisher:
    build: .
    command: npm run start:publisher
    environment:
      REDIS_URL: redis://redis:6379
      SIMULATION_INTERVAL_MS: ${SIMULATION_INTERVAL_MS:-10000}
      STREAM_MAX_LENGTH: ${STREAM_MAX_LENGTH:-360}
      SCENARIO_CYCLES: ${SCENARIO_CYCLES:-6}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build: .
    command: npm run start:processor
    environment:
      REDIS_URL: redis://redis:6379
      ALERT_TTL_SECONDS: ${ALERT_TTL_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Facilita la demostracion local. No se debe habilitar asi en produccion.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PLUGINS_PREINSTALL: redis-datasource@2.2.0
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smart-traffic.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  grafana-data:
